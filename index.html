

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0">


<title>

Real Estate AI

</title>


<script src="https://cdn.tailwindcss.com">

</script>

</head>


<body class="bg-slate-950 text-white">


<div class="max-w-7xl mx-auto px-6 py-10">


<h1 class="text-4xl font-bold">

🏠 Real Estate AI

</h1>


<p class="text-slate-400 mt-2 mb-10">

Property Price Prediction & Investment Intelligence

</p>


<div class="grid lg:grid-cols-2 gap-8">


<!-- FORM -->

<div class="bg-slate-900 p-6 rounded-2xl">


<h2 class="text-2xl font-bold mb-6">

Property Information

</h2>


<form id="predictionForm"

class="space-y-4">


<select id="City"

class="input">

<option>New York</option>

<option>Los Angeles</option>

<option>Chicago</option>

<option>Houston</option>

<option>Phoenix</option>

<option>Dallas</option>

<option>Miami</option>

<option>Seattle</option>

<option>Boston</option>

<option>Denver</option>

</select>


<select id="Neighborhood_Type"

class="input">

<option>Downtown</option>

<option>Suburban</option>

<option>Urban</option>

<option>Coastal</option>

<option>Residential</option>

<option>Business District</option>

</select>


<select id="Property_Type"

class="input">

<option>Apartment</option>

<option>House</option>

<option>Condo</option>

<option>Townhouse</option>

<option>Villa</option>

</select>


<input

id="Bedrooms"

type="number"

value="3"

placeholder="Bedrooms"

class="input"


>


<input

id="Bathrooms"

type="number"

value="2"

placeholder="Bathrooms"

class="input"


>


<input

id="Area_SqFt"

type="number"

value="1800"

placeholder="Area SqFt"

class="input"


>


<input

id="Year_Built"

type="number"

value="2015"

placeholder="Year Built"

class="input"


>


<input

id="Property_Age"

type="number"

value="11"

placeholder="Property Age"

class="input"


>


<select

id="Condition"

class="input">


<option>Excellent</option>

<option>Good</option>

<option>Average</option>

<option>Needs Renovation</option>


</select>


<select

id="Furnished"

class="input">


<option>Furnished</option>

<option>Semi-Furnished</option>

<option>Unfurnished</option>


</select>


<input

id="Parking_Spaces"

type="number"

value="2"

placeholder="Parking Spaces"

class="input"


>


<select

id="Has_Pool"

class="input">


<option>Yes</option>

<option>No</option>


</select>


<select

id="Has_Garden"

class="input">


<option>Yes</option>

<option>No</option>


</select>


<input

id="Distance_to_City_Center_Miles"

type="number"

step="0.1"

value="5"

placeholder="Distance to City Center"

class="input"


>


<input

id="Distance_to_School_Miles"

type="number"

step="0.1"

value="2"

placeholder="Distance to School"

class="input"


>


<input

id="Distance_to_Hospital_Miles"

type="number"

step="0.1"

value="3"

placeholder="Distance to Hospital"

class="input"


>


<input

id="Crime_Rate_Index"

type="number"

step="0.1"

value="35"

placeholder="Crime Rate Index"

class="input"


>


<input

id="School_Rating"

type="number"

step="0.1"

value="8"

placeholder="School Rating"

class="input"


>


<input

id="Local_Amenities_Score"

type="number"

step="0.1"

value="80"

placeholder="Amenities Score"

class="input"


>


<input

id="Market_Growth_Rate_Percent"

type="number"

step="0.1"

value="5"

placeholder="Market Growth %"

class="input"


>


<input

id="Gross_Rental_Yield_Percent"

type="number"

step="0.1"

value="6"

placeholder="Rental Yield %"

class="input"


>


<input

id="Days_on_Market"

type="number"

value="60"

placeholder="Days on Market"

class="input"


>


<button

class="w-full bg-indigo-600 hover:bg-indigo-700 py-3 rounded-xl font-semibold">


Predict Property


</button>


</form>


</div>


<!-- RESULT -->

<div

id="result"

class="bg-slate-900 p-6 rounded-2xl">


<h2 class="text-2xl font-bold mb-6">


AI Prediction


</h2>


<p class="text-slate-400">


Enter property details to generate AI predictions.


</p>


</div>


</div>


</div>


<style>


.input {

width: 100%;

background: #020617;

border: 1px solid #334155;

padding: 12px;

border-radius: 10px;

color: white;

}


</style>


<script>


const features = [

"City",

"Neighborhood_Type",

"Property_Type",

"Bedrooms",

"Bathrooms",

"Area_SqFt",

"Year_Built",

"Property_Age",

"Condition",

"Furnished",

"Parking_Spaces",

"Has_Pool",

"Has_Garden",

"Distance_to_City_Center_Miles",

"Distance_to_School_Miles",

"Distance_to_Hospital_Miles",

"Crime_Rate_Index",

"School_Rating",

"Local_Amenities_Score",

"Market_Growth_Rate_Percent",

"Gross_Rental_Yield_Percent",

"Days_on_Market"

];


const numericFeatures = [

"Bedrooms",

"Bathrooms",

"Area_SqFt",

"Year_Built",

"Property_Age",

"Parking_Spaces",

"Distance_to_City_Center_Miles",

"Distance_to_School_Miles",

"Distance_to_Hospital_Miles",

"Crime_Rate_Index",

"School_Rating",

"Local_Amenities_Score",

"Market_Growth_Rate_Percent",

"Gross_Rental_Yield_Percent",

"Days_on_Market"

];


document

.getElementById(

"predictionForm"

)

.addEventListener(

"submit",

async function(event) {


event.preventDefault();


let data = {};


features.forEach(

function(feature) {


const element = document

.getElementById(

feature

);


if (

numericFeatures

.includes(

feature

)

) {


data[feature] = Number(

element.value

);


} else {


data[feature] = element.value;


}


}


);


const response = await fetch(

"/api/predict",

{


method: "POST",


headers: {


"Content-Type": "application/json"


},


body: JSON.stringify(data)


}


);


const result = await response.json();


if (

result.success

) {


document

.getElementById(

"result"

)

.innerHTML = `


<h2 class="text-2xl font-bold mb-6">

AI Prediction Results

</h2>


<div class="space-y-5">


<div class="bg-slate-800 p-5 rounded-xl">


<p class="text-slate-400">

Estimated Property Price

</p>


<p class="text-3xl font-bold mt-2">

$${result.predicted_price.toLocaleString()}

</p>


</div>


<div class="bg-slate-800 p-5 rounded-xl">


<p class="text-slate-400">

Investment Score

</p>


<p class="text-3xl font-bold mt-2">

${result.investment_score}/100

</p>


</div>


<div class="bg-slate-800 p-5 rounded-xl">


<p class="text-slate-400">

Investment Rating

</p>


<p class="text-2xl font-bold mt-2">

${result.investment_rating}

</p>


</div>


<div class="bg-indigo-600 p-5 rounded-xl">


<p class="text-indigo-200">

Recommended Strategy

</p>


<p class="text-xl font-bold mt-2">

${result.recommended_strategy}

</p>


</div>


</div>


`;


} else {


alert(result.error);


}


}


);


</script>


</body>


</html>
